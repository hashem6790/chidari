name: ساخت و آزمایش

# با هر push روی main یا هر Pull Request اجرا می‌شود
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:      # امکان اجرای دستی از تب Actions

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: آماده‌سازی JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: ساخت فایل کلیدها
        # کلیدها از GitHub Secrets خوانده می‌شوند، نه از سورس.
        # اگر Secret تنظیم نشده باشد، فایل خالی ساخته می‌شود و اپ
        # در «حالت مهمان» build می‌گردد (بدون ثبت‌نام) — build نمی‌شکند.
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > secrets.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> secrets.properties

      - name: اجازه اجرا به gradlew
        run: chmod +x ./gradlew

      - name: اجرای تست‌های واحد
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: ساخت APK دیباگ
        run: ./gradlew assembleDebug --no-daemon

      - name: بارگذاری APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiDari-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: بارگذاری گزارش تست در صورت شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
