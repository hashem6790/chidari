name: انتشار نسخه

# با ساختن تگی مثل v2.0 اجرا می‌شود و APK امضاشده را منتشر می‌کند
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'شماره نسخه (مثلاً 2.0)'
        required: true

permissions:
  contents: write        # برای ساختن Release لازم است

jobs:
  release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: آماده‌سازی JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: ساخت فایل کلیدهای Supabase
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > secrets.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> secrets.properties

      - name: بازسازی کلید امضا از Secret
        # کلید به‌صورت base64 در Secret نگهداری می‌شود.
        # امضای یکسان تضمین می‌کند نسخه تازه روی نسخه قبلی نصب شود.
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_BASE64 تنظیم نشده — بدون آن APK امضا نمی‌شود"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          echo "کلید بازسازی شد ($(stat -c%s release.keystore) بایت)"

      - name: اجازه اجرا به gradlew
        run: chmod +x ./gradlew

      - name: اجرای تست‌ها
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: ساخت APK امضاشده
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: تأیید امضای APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "فایل: $APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" \
            | grep -i "signer #1 certificate SHA-256" || echo "هشدار: امضا بررسی نشد"

      - name: تعیین نام نسخه
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: تغییر نام فایل خروجی
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "dist/ChiDari-${{ steps.ver.outputs.name }}.apk"
          ls -lh dist/

      - name: انتشار Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: نسخه ${{ steps.ver.outputs.name }}
          draft: false
          prerelease: false
          files: dist/*.apk
          body: |
            ## چی داری؟ — نسخه ${{ steps.ver.outputs.name }}

            فایل نصبی را از بخش **Assets** پایین همین صفحه دانلود کنید.

            ### نصب
            اگر نسخه قبلی را دارید، این فایل **روی آن نصب می‌شود** و
            داده‌هایتان پاک نمی‌شود.

            > نخستین‌بار که از نسخه دیباگ به نسخه انتشار می‌روید، باید
            > نسخه دیباگ را یک‌بار حذف کنید (شناسه بسته متفاوت است).

            ### به‌روزرسانی خودکار
            از داخل برنامه: **منو ☰ → درباره → بررسی به‌روزرسانی**
